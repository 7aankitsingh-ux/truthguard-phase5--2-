version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: truthguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-truthguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-truthguard_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-truthguard}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-truthguard} -d ${POSTGRES_DB:-truthguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - truthguard-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truthguard-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-truthguard}:${POSTGRES_PASSWORD:-truthguard_secure_password_2026}@db:5432/${POSTGRES_DB:-truthguard}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      STORAGE_DIR: /app/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      EXTERNAL_SEARCH_API_KEY: ${EXTERNAL_SEARCH_API_KEY:-}
      GOOGLE_FACTCHECK_API_KEY: ${GOOGLE_FACTCHECK_API_KEY:-}
      REVERSE_IMAGE_API_KEY: ${REVERSE_IMAGE_API_KEY:-}
      EXTERNAL_AI_DETECTOR_API_KEY: ${EXTERNAL_AI_DETECTOR_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - truthguard-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: truthguard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - truthguard-network

networks:
  truthguard-network:
    driver: bridge

volumes:
  pgdata:
  uploads_data:
